<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pyodide-terminal</title>
  <!--
    Python i webbläsaren med terminal-input, klasser och funktioner.

    Filer (lägg dem i samma mapp på webbservern):
      pyodide-terminal.html   denna fil
      pyterm-helper.js        hjälpfil som gör att input() fungerar
                              som i en riktig terminal

    Ladda ett program från samma mapp:
      pyodide-terminal.html?program1.py
      pyodide-terminal.html?file=program1.py
      pyodide-terminal.html?ovningar/uppgift1.py

    Saknas hjälpfilen, eller öppnas sidan direkt från datorn,
    används pop-up-läge: input() frågar i en dialogruta.
  -->
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 16px;
      background: #fafafa;
      color: #1a1a1a;
    }
    h1 { font-size: 1.3rem; }
    #fileInfo { margin: -4px 0 12px; font-size: 0.9rem; color: #555; }
    #fileInfo code { background: #eee; padding: 1px 6px; border-radius: 3px; }
    #fileInfo.load-error { color: #b03a2e; }
    #modeInfo { margin: -4px 0 12px; font-size: 0.85rem; color: #8a5a00;
                background: #fff6e0; border: 1px solid #f0d9a0; border-radius: 4px; padding: 6px 10px; }
    #editorToolbar { margin-bottom: 6px; display: flex; gap: 6px; }
    #editorToolbar button { padding: 4px 12px; font-size: 0.85rem; }
    #editor {
      border: 1px solid #bbb;
      border-radius: 4px;
      height: 260px;
      margin-bottom: 8px;
      background: #fff;
      overflow: hidden;
    }
    /* Låser CodeMirror till divens höjd och ger en rullist */
    #editor .cm-editor { height: 100%; }
    #editor .cm-scroller { overflow: auto; }
    #controls { margin-bottom: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    button {
      padding: 6px 16px;
      font-size: 0.95rem;
      border: 1px solid #888;
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
    }
    button:hover:not(:disabled) { background: #eee; }
    button:disabled { opacity: 0.5; cursor: default; }
    #status { font-size: 0.85rem; color: #666; }
    #status.error { color: #b03a2e; }
    #output {
      width: 100%;
      box-sizing: border-box;
      height: 260px;
      font-family: "Consolas", "Menlo", monospace;
      font-size: 0.95rem;
      background: #111;
      color: #e8e8e8;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 8px;
      resize: vertical;
      outline: none;
    }
    #output.waiting-input { border-color: #6ab04c; box-shadow: 0 0 0 2px rgba(106,176,76,0.35); }
    label[for="output"] { display: block; margin-bottom: 4px; font-weight: 600; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <h1>Python i webbläsaren</h1>

  <p id="fileInfo" hidden></p>
  <p id="modeInfo" hidden></p>

  <div id="editorToolbar">
    <button id="undoBtn" disabled title="Ångra (Ctrl+Z)">&#8630; Ångra</button>
    <button id="redoBtn" disabled title="Gör om (Ctrl+Y)">&#8631; Gör om</button>
  </div>
  <div id="editor"></div>

  <div id="controls">
    <button id="runBtn" disabled>Kör Python</button>
    <button id="stopBtn" disabled>Stoppa</button>
    <button id="resetBtn" disabled>Starta om miljön</button>
    <span id="status">Laddar Python…</span>
  </div>

  <label for="output">Terminal</label>
  <textarea id="output" readonly spellcheck="false"></textarea>

  <script type="module">
    import { EditorView, basicSetup } from "https://esm.sh/codemirror";
    import { python } from "https://esm.sh/@codemirror/lang-python";
    import { undo, redo, undoDepth, redoDepth } from "https://esm.sh/@codemirror/commands";

    const PYODIDE_URL = "https://cdn.jsdelivr.net/pyodide/v0.26.0/full/pyodide.mjs";
    const HELPER      = "pyterm-helper.js";
    const RELOAD_KEY  = "pyterm-reloaded";

    const DEFAULT_CODE = ` print("Skriv din kod här")`;

    // Python-kod som körs en gång när miljön startar
    const SETUP = `
import builtins, sys, time, traceback, linecache
import js

class _Stopped(BaseException):
    pass

def _input(prompt=""):
    if prompt:
        sys.stdout.write(str(prompt))
    sys.stdout.flush()
    svar = js.readLine()
    if svar is None:
        raise _Stopped()
    return svar

builtins.input = _input

def _sleep(sekunder):
    sys.stdout.flush()
    if not js.sleepMs(float(sekunder) * 1000):
        raise _Stopped()

time.sleep = _sleep

def _run_program(source):
    linecache.cache["<program>"] = (len(source), None, source.splitlines(True), "<program>")
    ns = {"__name__": "__main__", "__builtins__": builtins}
    try:
        code = compile(source, "<program>", "exec")
        exec(code, ns)
    except (KeyboardInterrupt, _Stopped):
        sys.stdout.flush()
        print("\\n[Körningen avbröts]")
    except SystemExit:
        pass
    except BaseException as e:
        # Visa bara de delar av felet som hör till studentens program
        tb = e.__traceback__
        while tb is not None and tb.tb_frame.f_code.co_filename != "<program>":
            tb = tb.tb_next
        sys.stdout.flush()
        traceback.print_exception(type(e), e, tb)
    finally:
        sys.stdout.flush()
        sys.stderr.flush()
`;

    const output   = document.getElementById("output");
    const runBtn   = document.getElementById("runBtn");
    const stopBtn  = document.getElementById("stopBtn");
    const resetBtn = document.getElementById("resetBtn");
    const status   = document.getElementById("status");
    const undoBtn  = document.getElementById("undoBtn");
    const redoBtn  = document.getElementById("redoBtn");
    const fileInfo = document.getElementById("fileInfo");
    const modeInfo = document.getElementById("modeInfo");

    function setStatus(text, isError = false) {
      status.textContent = text;
      status.classList.toggle("error", isError);
    }

    function safeSession(fn) { try { return fn(window.sessionStorage); } catch { return null; } }

    /* =========================================================
       Säkerhetshuvuden via hjälpfilen (service worker)
       =========================================================
       Om sidan inte redan är isolerad registreras hjälpfilen och
       sidan laddas om EN gång. Därefter är huvudena på plats.
       ========================================================= */
    if (!window.crossOriginIsolated && "serviceWorker" in navigator && window.isSecureContext &&
        safeSession((s) => s.getItem(RELOAD_KEY)) !== "1") {
      try {
        await navigator.serviceWorker.register(HELPER, { scope: location.pathname });
        await navigator.serviceWorker.ready;
        safeSession((s) => s.setItem(RELOAD_KEY, "1"));
        location.reload();
        await new Promise(() => {});     // vänta på omladdningen
      } catch (err) {
        console.warn("Hjälpfilen kunde inte registreras:", err);
      }
    }
    if (window.crossOriginIsolated) safeSession((s) => s.removeItem(RELOAD_KEY));

    /* =========================================================
       Hämta program från adressen (?program1.py)
       ========================================================= */
    async function loadProgram() {
      const params = new URLSearchParams(location.search);
      let req = params.has("file") ? params.get("file") : location.search.slice(1);
      try { req = decodeURIComponent(req); } catch { /* lämna som den är */ }
      req = req.trim();
      if (!req) return DEFAULT_CODE;

      const showError = (text) => {
        fileInfo.textContent = text + " — visar standardexemplet i stället.";
        fileInfo.className = "load-error";
        fileInfo.hidden = false;
      };

      // Bara .py-filer i samma mapp (eller undermapp) som sidan
      if (!/^[A-Za-z0-9._\/-]+\.py$/.test(req) || req.includes("..") || req.startsWith("/")) {
        showError("Otillåtet filnamn: " + req);
        return DEFAULT_CODE;
      }
      try {
        const res = await fetch(req, { cache: "no-cache" });
        if (!res.ok) throw new Error();
        const text = await res.text();
        fileInfo.innerHTML = "Program: <code></code>";
        fileInfo.querySelector("code").textContent = req;
        fileInfo.className = "";
        fileInfo.hidden = false;
        return text;
      } catch {
        showError(location.protocol === "file:"
          ? "Kan inte läsa " + req + " när sidan öppnas direkt från datorn"
          : "Hittar inte filen: " + req);
        return DEFAULT_CODE;
      }
    }

    /* =========================================================
       Editor med ångra/gör om
       ========================================================= */
    function refreshUndoRedo(state) {
      undoBtn.disabled = undoDepth(state) === 0;
      redoBtn.disabled = redoDepth(state) === 0;
    }

    const editor = new EditorView({
      doc: await loadProgram(),
      extensions: [
        basicSetup,
        python(),
        EditorView.updateListener.of((update) => {
          if (update.docChanged) refreshUndoRedo(update.state);
        }),
      ],
      parent: document.getElementById("editor"),
    });

    undoBtn.addEventListener("click", () => { undo(editor); refreshUndoRedo(editor.state); editor.focus(); });
    redoBtn.addEventListener("click", () => { redo(editor); refreshUndoRedo(editor.state); editor.focus(); });

    /* =========================================================
       Terminal
       ========================================================= */
    let lockedText = "";
    let waitingForInput = false;
    let pending = "";          // utskrifter som väntar på att ritas ut
    let flushScheduled = false;

    // Samlar ihop utskrifter och ritar ut dem högst en gång per
    // bildruta — annars blir sidan seg vid tusentals print()
    function queueOutput(s) {
      pending += s;
      if (!flushScheduled) {
        flushScheduled = true;
        requestAnimationFrame(flushOutput);
      }
    }

    function flushOutput() {
      flushScheduled = false;
      if (!pending) return;
      output.value += pending;
      pending = "";
      if (!waitingForInput) lockedText = output.value;
      output.scrollTop = output.scrollHeight;
    }

    function lockOutput() {
      output.readOnly = true;
      output.classList.remove("waiting-input");
      waitingForInput = false;
      lockedText = output.value;
    }

    function unlockForInput() {
      flushOutput();
      waitingForInput = true;
      output.readOnly = false;
      output.classList.add("waiting-input");
      lockedText = output.value;
      output.focus();
      output.setSelectionRange(output.value.length, output.value.length);
      output.scrollTop = output.scrollHeight;
    }

    // Skydda redan utskriven text
    output.addEventListener("keydown", (e) => {
      if (output.readOnly) return;
      const lockedLength = lockedText.length;
      if (output.selectionStart < lockedLength) {
        output.setSelectionRange(output.value.length, output.value.length);
      }
      if ((e.key === "Backspace" && output.selectionStart <= lockedLength) ||
          (e.key === "Delete"    && output.selectionStart <  lockedLength)) {
        e.preventDefault();
      }
    });

    // Enter = skicka raden till Python
    output.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && waitingForInput) {
        e.preventDefault();
        const userInput = output.value.substring(lockedText.length);
        output.value += "\n";
        lockOutput();
        sendInput(userInput);
      }
    });

    /* =========================================================
       Läge 1: bakgrundstråd (terminal-input, Stoppa fungerar)
       ========================================================= */
    const READY = 1, STOPPED = 2;
    let worker = null;
    let ctrl, data, interrupt;
    let running = false;

    function sendInput(text) {
      let bytes = new TextEncoder().encode(text);
      if (bytes.length > data.length) bytes = bytes.slice(0, data.length);
      data.set(bytes);
      Atomics.store(ctrl, 1, bytes.length);
      Atomics.store(ctrl, 0, READY);
      Atomics.notify(ctrl, 0);
    }

    function startWorker() {
      if (worker) worker.terminate();
      running = false;
      runBtn.disabled = stopBtn.disabled = resetBtn.disabled = true;
      setStatus("Laddar Python…");

      ctrl      = new Int32Array(new SharedArrayBuffer(8));
      data      = new Uint8Array(new SharedArrayBuffer(1 << 16));
      interrupt = new Uint8Array(new SharedArrayBuffer(1));

      // Med hjälpfilen som service worker: starta tråden via sidans
      // egen adress (hjälpfilen svarar med rätt kod). Skickar servern
      // själv huvudena kan hjälpfilen laddas direkt.
      const workerUrl = navigator.serviceWorker && navigator.serviceWorker.controller
        ? location.pathname + "?__pyterm_worker"
        : HELPER;
      try {
        worker = new Worker(workerUrl);
      } catch (err) {
        setStatus("Kunde inte starta bakgrundstråden: " + err, true);
        resetBtn.disabled = false;
        return;
      }

      worker.onmessage = (e) => {
        const msg = e.data;
        switch (msg.type) {
          case "ready":
            setStatus("Klar. Tryck Kör.");
            runBtn.disabled = resetBtn.disabled = false;
            break;
          case "stdout":
          case "stderr":
            queueOutput(msg.text);
            break;
          case "input":
            unlockForInput();
            break;
          case "done":
            flushOutput();
            lockOutput();
            running = false;
            runBtn.disabled = false;
            stopBtn.disabled = true;
            setStatus("Klar. Tryck Kör.");
            break;
          case "fatal":
            setStatus("Kunde inte starta Python: " + msg.text, true);
            resetBtn.disabled = false;
            break;
        }
      };
      worker.onerror = (e) => {
        e.preventDefault();
        setStatus("Fel i bakgrundstråden: " + (e.message ||
          "kunde inte ladda " + HELPER + " (ligger den i samma mapp som sidan?)"), true);
        resetBtn.disabled = false;
      };

      worker.postMessage({
        type: "init",
        pyodideUrl: PYODIDE_URL,
        setup: SETUP,
        ctrlBuf: ctrl.buffer,
        dataBuf: data.buffer,
        interruptBuf: interrupt.buffer,
      });
    }

    /* =========================================================
       Läge 2: pop-up (när hjälpfilen inte kan användas)
       =========================================================
       Python körs direkt på sidan och input() frågar i en
       dialogruta. Dialogen visar de senaste raderna i terminalen
       så att man ser frågan. Stoppa går inte i detta läge.
       ========================================================= */
    let pyMain = null;

    async function startPopupMode() {
      runBtn.disabled = stopBtn.disabled = resetBtn.disabled = true;
      setStatus("Laddar Python…");
      modeInfo.textContent =
        "Pop-up-läge: input() frågar i en dialogruta och Stoppa fungerar inte. " +
        "För terminal-input: lägg sidan på en webbserver tillsammans med " + HELPER + ".";
      modeInfo.hidden = false;

      window.readLine = () => {
        const recent = output.value.split("\n").slice(-12).join("\n");
        const svar = window.prompt(recent || "input():");
        if (svar === null) return null;          // Avbryt = stoppa programmet
        output.value += svar + "\n";
        lockedText = output.value;
        return svar;
      };
      window.sleepMs = (ms) => {
        const end = performance.now() + ms;
        while (performance.now() < end) { /* vänta */ }
        return true;
      };

      try {
        const { loadPyodide } = await import(PYODIDE_URL);
        pyMain = await loadPyodide();
        const decoder = new TextDecoder();
        const write = (buf) => {
          output.value += decoder.decode(buf, { stream: true });
          lockedText = output.value;
          output.scrollTop = output.scrollHeight;
          return buf.length;
        };
        pyMain.setStdout({ write });
        pyMain.setStderr({ write });
        pyMain.setStdin({ stdin: () => { const s = window.readLine(); return s === null ? null : s + "\n"; } });
        pyMain.runPython(SETUP);
        setStatus("Klar. Tryck Kör.");
        runBtn.disabled = resetBtn.disabled = false;
      } catch (err) {
        setStatus("Kunde inte starta Python: " + err, true);
        resetBtn.disabled = false;
      }
    }

    /* =========================================================
       Knappar
       ========================================================= */
    const useWorker = window.crossOriginIsolated;

    runBtn.addEventListener("click", () => {
      if (running) return;
      running = true;
      runBtn.disabled = true;
      output.value = "";
      pending = "";
      lockOutput();
      const code = editor.state.doc.toString();

      if (useWorker) {
        stopBtn.disabled = false;
        setStatus("Kör… (Stoppa avbryter)");
        interrupt[0] = 0;
        worker.postMessage({ type: "run", code });
      } else {
        setStatus("Kör…");
        // Låt sidan ritas om innan Python tar över
        setTimeout(() => {
          try {
            pyMain.globals.get("_run_program")(code);
          } catch (err) {
            output.value += "\n[Internt fel] " + err + "\n";
          }
          running = false;
          runBtn.disabled = false;
          setStatus("Klar. Tryck Kör.");
        }, 30);
      }
    });

    stopBtn.addEventListener("click", () => {
      if (!running || !useWorker) return;
      stopBtn.disabled = true;
      setStatus("Stoppar…");
      interrupt[0] = 2;                 // 2 = SIGINT → KeyboardInterrupt i Python
      lockOutput();
      Atomics.store(ctrl, 0, STOPPED);  // väcker input() / time.sleep() om de väntar
      Atomics.notify(ctrl, 0);
    });

    resetBtn.addEventListener("click", () => {
      output.value = "";
      pending = "";
      lockOutput();
      if (useWorker) startWorker(); else startPopupMode();
    });

    /* =========================================================
       Start
       ========================================================= */
    if (useWorker) startWorker(); else startPopupMode();
  </script>
</body>
</html>
